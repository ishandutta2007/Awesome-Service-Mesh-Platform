<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 50px; fill: url(#text-grad); }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .node-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #f8fafc; }
    
    /* Animations */
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    .pulse-element { animation: pulse-node 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 8; animation: dash-flow 1.5s linear infinite; }
    .floating-card { animation: float-badge 4s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200 M0,360 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100,0 V380 M200,0 V380 M300,0 V380 M400,0 V380 M500,0 V380 M600,0 V380 M700,0 V380 M800,0 V380 M900,0 V380 M1000,0 V380 M1100,0 V380" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Service Mesh Topology / Dynamic Graph Background -->
  <g transform="translate(60, 20)">
    <!-- Connection Lines -->
    <path d="M 820 90 L 960 60 L 1080 130 L 980 230 L 840 210 Z" fill="none" stroke="url(#line-grad-1)" stroke-width="2" />
    <path d="M 820 90 L 980 230 M 960 60 L 840 210 M 960 60 L 980 230" fill="none" stroke="url(#line-grad-2)" stroke-width="1.5" />
    
    <!-- Flowing mTLS Packets -->
    <path d="M 820 90 L 960 60 L 1080 130 L 980 230 L 840 210 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" filter="url(#glow-subtle)" />
    
    <!-- Mesh Nodes -->
    <g transform="translate(820, 90)" class="pulse-element">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
      <text y="4" text-anchor="middle" class="node-label">Istio</text>
    </g>
    <g transform="translate(960, 60)" class="pulse-element" style="animation-delay: 0.6s;">
      <circle r="22" fill="#0f172a" stroke="#818cf8" stroke-width="3" filter="url(#glow)" />
      <text y="4" text-anchor="middle" class="node-label">Envoy</text>
    </g>
    <g transform="translate(1080, 130)" class="pulse-element" style="animation-delay: 1.2s;">
      <circle r="22" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="url(#glow)" />
      <text y="4" text-anchor="middle" class="node-label">Linkerd</text>
    </g>
    <g transform="translate(980, 230)" class="pulse-element" style="animation-delay: 1.8s;">
      <circle r="22" fill="#0f172a" stroke="#34d399" stroke-width="3" filter="url(#glow)" />
      <text y="4" text-anchor="middle" class="node-label">Cilium</text>
    </g>
    <g transform="translate(840, 210)" class="pulse-element" style="animation-delay: 2.4s;">
      <circle r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="3" filter="url(#glow)" />
      <text y="4" text-anchor="middle" class="node-label">Consul</text>
    </g>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(60, 70)">
    <!-- Top Category Pill -->
    <g class="floating-card">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="130" y="21" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ CLOUD-NATIVE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" class="title-text" filter="url(#glow-subtle)">Awesome Service Mesh Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="145" class="subtitle-text">Curated List of SaaS Platforms &amp; Open-Source Mesh Infrastructure</text>
    <text x="0" y="172" class="subtitle-text" font-size="16px" fill="#64748b">mTLS Security • Traffic Management • Observability • eBPF • Multi-Cluster</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: Open Source -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <circle cx="20" cy="18" r="6" fill="#818cf8" />
        <text x="36" y="23" class="badge-text">Open-Source Core</text>
      </g>
      <!-- Badge 2: Managed SaaS -->
      <g transform="translate(180, 0)">
        <rect width="165" height="36" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
        <circle cx="20" cy="18" r="6" fill="#34d399" />
        <text x="36" y="23" class="badge-text">SaaS Pricing Tiers</text>
      </g>
      <!-- Badge 3: Zero Trust -->
      <g transform="translate(360, 0)">
        <rect width="155" height="36" rx="8" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
        <circle cx="20" cy="18" r="6" fill="#fb7185" />
        <text x="36" y="23" class="badge-text">mTLS Zero-Trust</text>
      </g>
    </g>
  </g>
</svg>
