<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="line-grad-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/></linearGradient><linearGradient id="line-grad-2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.9}50%{transform:scale(1.15);opacity:1;filter:drop-shadow(0 0 12px #38bdf8)}}@keyframes float-badge{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.badge-text,.node-label,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-text{font-weight:800;font-size:50px;fill:url(#text-grad)}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.node-label{font-weight:700;font-size:12px;fill:#f8fafc}.pulse-element{animation:pulse-node 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.flow-line{stroke-dasharray:8 8;animation:dash-flow 1.5s linear infinite}.floating-card{animation:float-badge 4s ease-in-out infinite}</style><rect width="1200" height="380" fill="url(#bg-grad)" rx="16"/><g opacity=".07"><path stroke="#fff" stroke-width="1" d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200 M0,360 H1200"/><path stroke="#fff" stroke-width="1" d="M100,0 V380 M200,0 V380 M300,0 V380 M400,0 V380 M500,0 V380 M600,0 V380 M700,0 V380 M800,0 V380 M900,0 V380 M1000,0 V380 M1100,0 V380"/></g><g><path fill="none" stroke="url(#line-grad-1)" stroke-width="2" d="M 820 90 L 960 60 L 1080 130 L 980 230 L 840 210 Z" transform="translate(60, 20)"/><path fill="none" stroke="url(#line-grad-2)" stroke-width="1.5" d="M 820 90 L 980 230 M 960 60 L 840 210 M 960 60 L 980 230" transform="translate(60, 20)"/><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 820 90 L 960 60 L 1080 130 L 980 230 L 840 210 Z" class="flow-line" filter="url(#glow-subtle)" transform="translate(60, 20)"/><g class="pulse-element" transform="translate(60, 20) translate(820, 90)"><circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/><text y="4" class="node-label" text-anchor="middle">Istio</text></g><g class="pulse-element" transform="translate(60, 20) translate(960, 60)" style="animation-delay:.6s"><circle r="22" fill="#0f172a" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/><text y="4" class="node-label" text-anchor="middle">Envoy</text></g><g class="pulse-element" transform="translate(60, 20) translate(1080, 130)" style="animation-delay:1.2s"><circle r="22" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/><text y="4" class="node-label" text-anchor="middle">Linkerd</text></g><g class="pulse-element" transform="translate(60, 20) translate(980, 230)" style="animation-delay:1.8s"><circle r="22" fill="#0f172a" stroke="#34d399" stroke-width="3" filter="url(#glow)"/><text y="4" class="node-label" text-anchor="middle">Cilium</text></g><g class="pulse-element" transform="translate(60, 20) translate(840, 210)" style="animation-delay:2.4s"><circle r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/><text y="4" class="node-label" text-anchor="middle">Consul</text></g></g><g><g class="floating-card" transform="translate(60, 70)"><rect width="260" height="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="16"/><text x="130" y="21" fill="#38bdf8" class="badge-text" text-anchor="middle">⚡ CLOUD-NATIVE ECOSYSTEM</text></g><text x="0" y="105" class="title-text" filter="url(#glow-subtle)" transform="translate(60, 70)">Awesome Service Mesh Platform</text><text x="0" y="145" class="subtitle-text" transform="translate(60, 70)">Curated List of SaaS Platforms &amp; Open-Source Mesh Infrastructure</text><text x="0" y="172" fill="#64748b" class="subtitle-text" font-size="16" transform="translate(60, 70)">mTLS Security • Traffic Management • Observability • eBPF • Multi-Cluster</text><g><g transform="translate(60, 70) translate(0, 215) translate(0, 0)"><rect width="165" height="36" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" rx="8"/><circle cx="20" cy="18" r="6" fill="#818cf8"/><text x="36" y="23" class="badge-text">Open-Source Core</text></g><g transform="translate(60, 70) translate(0, 215) translate(180, 0)"><rect width="165" height="36" fill="#064e3b" stroke="#34d399" stroke-width="1" rx="8"/><circle cx="20" cy="18" r="6" fill="#34d399"/><text x="36" y="23" class="badge-text">SaaS Pricing Tiers</text></g><g transform="translate(60, 70) translate(0, 215) translate(360, 0)"><rect width="155" height="36" fill="#4c0519" stroke="#fb7185" stroke-width="1" rx="8"/><circle cx="20" cy="18" r="6" fill="#fb7185"/><text x="36" y="23" class="badge-text">mTLS Zero-Trust</text></g></g></g></svg>